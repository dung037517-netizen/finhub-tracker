name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Strict TypeScript: the build must not rely on `any` anywhere.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      # The engine tests pin numerical output against closed-form results,
      # so a regression in the mathematics fails the build, not just the UI.
      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  no-any:
    name: Guard against `any`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if `any` appears in source
        run: |
          if grep -rnE '(: any\b|<any>|as any)' \
             --include='*.ts' --include='*.tsx' \
             app components lib types tests; then
            echo "::error::Found a use of \`any\`. This codebase is strictly typed."
            exit 1
          fi
          echo "No uses of \`any\` found."
